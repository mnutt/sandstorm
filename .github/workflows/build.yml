name: build_and_test

on: [push, pull_request, workflow_dispatch]

permissions:
  actions: read
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
jobs:
  build_and_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: cache pinned Meteor toolchain
        id: meteor-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.meteor/meteor
            ~/.meteor/package-metadata
            ~/.meteor/packages/meteor-tool
          key: meteor-tool-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell/.meteor/release') }}
      - name: generate deps cache key
        id: deps-cache-key
        run: |
          # Generate a hash based on all submodule SHAs
          DEPS_HASH=$(git submodule status | sha256sum | cut -d' ' -f1)
          echo "hash=$DEPS_HASH" >> $GITHUB_OUTPUT
      - name: cache deps build artifacts
        id: deps-cache
        uses: actions/cache@v5
        with:
          path: |
            build/ci/_deps/libsodium
          key: cmake-deps-${{ runner.os }}-${{ steps.deps-cache-key.outputs.hash }}
      - name: install dependencies
        run: |
            export DEBIAN_FRONTEND=noninteractive
            echo "The build of boringssl requires golang."
            echo "The github runner seems to have some version of golang already; installing golang-go breaks."
            which go || (sudo apt-get update && sudo apt-get install golang-go)

            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
                build-essential libcap-dev xz-utils zip unzip strace curl discount git python3 zlib1g-dev cmake ninja-build ccache apparmor

            # Install OpenSSL 1.1 (required for Meteor/Node compatibility)
            # Ubuntu 24.04 only ships OpenSSL 3.x, so we need to install 1.1 from older release
            wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
            sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
            rm libssl1.1_1.1.1f-1ubuntu2_amd64.deb

            # Ubuntu 24.04 restricts unprivileged user namespaces by default via AppArmor.
            # Sandstorm requires user namespaces for sandboxing, so grant that permission
            # to the binaries used by this CI run.
            cat > /tmp/sandstorm-ci-apparmor <<EOF
            profile sandstorm-ci-bin $GITHUB_WORKSPACE/bin/sandstorm flags=(unconfined) {
              userns,
            }

            profile spk-ci-bin $GITHUB_WORKSPACE/bin/spk flags=(unconfined) {
              userns,
            }

            profile sandstorm-ci-bundle $GITHUB_WORKSPACE/bundle/sandstorm flags=(unconfined) {
              userns,
            }

            profile sandstorm-cmake-ci-bin $GITHUB_WORKSPACE/build/ci/bin/sandstorm flags=(unconfined) {
              userns,
            }

            profile spk-cmake-ci-bin $GITHUB_WORKSPACE/build/ci/bin/spk flags=(unconfined) {
              userns,
            }

            profile sandstorm-cmake-ci-bundle $GITHUB_WORKSPACE/build/ci/bundle/sandstorm flags=(unconfined) {
              userns,
            }

            profile sandstorm-ci-test $GITHUB_WORKSPACE/tests/tmp-sandstorm/sandstorm flags=(unconfined) {
              userns,
            }

            profile sandstorm-ci-test-latest $GITHUB_WORKSPACE/tests/tmp-sandstorm/latest/sandstorm flags=(unconfined) {
              userns,
            }

            profile sandstorm-ci-test-build $GITHUB_WORKSPACE/tests/tmp-sandstorm/sandstorm-*/sandstorm flags=(unconfined) {
              userns,
            }

            profile sandstorm-ci-test-custom-build $GITHUB_WORKSPACE/tests/tmp-sandstorm/sandstorm-custom.*/sandstorm flags=(unconfined) {
              userns,
            }
            EOF
            sudo mv /tmp/sandstorm-ci-apparmor /etc/apparmor.d/sandstorm-ci
            sudo apparmor_parser -r /etc/apparmor.d/sandstorm-ci
      - name: install Meteor and pinned toolchain
        run: |
            set -o pipefail
            if [ ! -x "$HOME/.meteor/meteor" ]; then
              curl https://install.meteor.com/ | sh
            fi
            export PATH="$HOME/.meteor:$PATH"
            echo "$HOME/.meteor" >> "$GITHUB_PATH"
            # The installer provides the launcher, but CMake needs the Node
            # runtime and headers from the release pinned by shell/.meteor/release.
            # Bootstrap it on a cache miss, or validate the restored toolchain.
            (cd shell && meteor node --version)
      - name: cache ccache files
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ github.run_number }}
          restore-keys: ccache-
      - name: print and zero ccache stats
        run: |
            mkdir -p "$CCACHE_DIR"
            ccache -s
            ccache -z
      - name: CMake build and package
        run: |
            set -x
            export CCACHE_COMPRESS="true"
            export CCACHE_COMPRESSLEVEL="6"
            export CCACHE_MAXSIZE="1G"
            #     export CCACHE_DEBUG=1
            export CCACHE_SLOPPINESS="time_macros"
            export PATH=/usr/lib/ccache:$CLANGDIR:$PATH

            cmake --preset ci
            cmake --build --preset ci
            ctest --preset ci
            cmake --build --preset ci --target package-fast test-app-spk meteor-testapp-spk
      - name: print ccache stats
        run: |
            ccache -s
      #      # for debugging ccache misses
      #      find . -iname *ccache* | tar -czf ccache-debug.tar.gz -T /dev/stdin
      #- name: upload ccache debug tarball
      #  uses: actions/upload-artifact@v7
      #  with:
      #    name: ccache-debug.tar.gz
      #    path: ccache-debug.tar.gz
      - name: upload sandstorm tarball
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandstorm-0-fast.tar.xz
          path: build/ci/packages/sandstorm-0-fast.tar.xz
      - name: typecheck-ts
        run: cmake --build --preset ci --target typecheck
      - name: lint
        run: |
          set -o pipefail
          # In addition to making sure the linting step doesn't flag any errors,
          # we also want to make sure the number of warnings doesn't increase.
          # We check for equality; if the number decreases, great! But then update
          # the constant below.
          cmake --build --preset ci --target lint | tee lint.log
          num_problems=$(cat lint.log | grep ' problems (0 errors, ' | awk '{print $2}')
          [ "$num_problems" = 537 ]
      - name: test
        run: |
          set -o pipefail
          set +e
          cmake --build --preset ci --target system-test |& tee testlog.txt
          result=${PIPESTATUS[0]}
          set -e
          echo "Result: $result"
          exit "$result"
      - name: upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testlog.txt
          path: testlog.txt
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/screenshots
          if-no-files-found: ignore
      - name: upload visual snapshots
        id: upload-visual-snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshots
          path: tests/visual-snapshots/current
          if-no-files-found: ignore

  visual_snapshot_comparison:
    runs-on: ubuntu-24.04
    needs: build_and_test
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: download baseline visual snapshots
        env:
          # Temporary baseline until visual snapshot baselines are published from master.
          BASELINE_RUN_ID: "30721959653"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tests/visual-snapshots/master
          run_id="$BASELINE_RUN_ID"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name visual-snapshots \
              --dir tests/visual-snapshots/master || true
          fi
      - name: download current visual snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tests/visual-snapshots/current
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name visual-snapshots \
            --dir tests/visual-snapshots/current || true
      - name: install visual comparison dependencies
        run: |
          cd tests
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jimp@1.6.1
      - name: compare visual snapshots
        run: |
          cd tests
          VISUAL_REPORT_INLINE_IMAGES=true node compare-visual-snapshots.js visual-snapshots/master visual-snapshots/current visual-report
          cp visual-report/index.html visual-snapshot-report.html
      - name: upload viewable visual snapshot report
        id: upload-viewable-visual-report
        uses: actions/upload-artifact@v7
        with:
          path: tests/visual-snapshot-report.html
          archive: false
      - name: upload visual snapshot report
        id: upload-visual-report
        uses: actions/upload-artifact@v7
        with:
          name: visual-snapshot-report
          path: |
            tests/visual-report
            tests/visual-snapshots/master
            tests/visual-snapshots/current
          if-no-files-found: ignore
      - name: summarize visual snapshot report
        if: steps.upload-viewable-visual-report.outputs.artifact-url != ''
        run: |
          {
            echo "## Visual snapshot report"
            echo
            echo "View report: ${{ steps.upload-viewable-visual-report.outputs.artifact-url }}"
            echo
            echo "Downloadable report artifact: ${{ steps.upload-visual-report.outputs.artifact-url }}"
            echo
            if [ -f tests/visual-report/summary.json ]; then
              node -e '
                const rows = require("./tests/visual-report/summary.json");
                const counts = rows.reduce((acc, row) => {
                  acc[row.status] = (acc[row.status] || 0) + 1;
                  return acc;
                }, {});
                console.log(`Changed: ${counts.changed || 0}`);
                console.log(`Added: ${counts.added || 0}`);
                console.log(`Removed: ${counts.removed || 0}`);
                console.log(`Unchanged: ${counts.unchanged || 0}`);
              '
            fi
          } >> "$GITHUB_STEP_SUMMARY"
