[package]
name = "sandstorm-rust-shell"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
axum = { version = "=0.8.9", features = ["ws"] }
capnp = "=0.25.4"
capnp-rpc = "=0.25.1"
capnp-futures = "=0.25.2"
futures = "0.3"
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "sync", "time", "io-util", "fs"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[build-dependencies]
capnpc = "=0.25.3"
