<template name="isolateAuthoringPage">
  {{setDocumentTitle}}
  {{#sandstormTopbarItem name="title" priority=5 topbar=globalTopbar}}Create app{{/sandstormTopbarItem}}

  <main class="isolate-authoring-page">
    <div class="isolate-authoring-workspace {{#if previewTarget}}has-preview{{/if}}">
      <section class="isolate-authoring-editor" aria-label="Isolate app editor">
        <header class="isolate-authoring-editor-heading">
          <div class="isolate-authoring-app-title">
            <h1>{{draft.title}}</h1>
            <button type="button" class="edit-app-details" disabled={{busy}}>Edit</button>
          </div>
          <div class="isolate-authoring-heading-actions">
            <button type="button" class="reset-preview" disabled={{resetDisabled}}>Reset</button>
            <button type="button" class="preview-draft primary" disabled={{busy}}>Preview</button>
          </div>
        </header>

        <section class="source-editor" aria-label="Isolate JavaScript source">
          <label class="visually-hidden" for="isolate-worker-source">Isolate JavaScript</label>
          <textarea id="isolate-worker-source" name="source" required spellcheck="false"
                    disabled={{busy}} value="{{draft.source}}"></textarea>
        </section>

        {{#if operationStatus}}
          <p class="operation-status {{operationStatus.kind}}" role="status">
            {{operationStatus.message}}
          </p>
        {{/if}}
      </section>

      <aside class="isolate-inline-preview" aria-label="Isolate app preview">
        <header class="isolate-preview-toolbar">
          <div class="isolate-preview-title">
            <strong>Preview</strong>
            {{#if previewTarget}}
              <code title="{{previewTarget.normalizedDigest}}">{{previewDigest}}</code>
            {{/if}}
          </div>
          {{#if previewTarget}}
            <div class="isolate-preview-actions">
              <button type="button" class="reload-inline-preview isolate-preview-icon-action"
                      aria-label="Reload preview" title="Reload preview">
                <span class="icon icon-refresh" aria-hidden="true"></span>
              </button>
              <a class="isolate-preview-icon-action" href="/grain/{{previewTarget.grainId}}"
                 target="_blank" rel="noopener" aria-label="Open preview in new tab"
                 title="Open preview in new tab">
                <span class="icon icon-open-in-new" aria-hidden="true"></span>
              </a>
              <button type="button" class="open-publish-modal isolate-preview-publish"
                      disabled={{publishDisabled}}>Publish</button>
            </div>
          {{/if}}
        </header>
        <div class="isolate-preview-frame-mount"></div>
        <div class="isolate-preview-log-mount"></div>
      </aside>
    </div>

    {{#if detailsModalOpen}}
      {{#modalDialogWithBackdrop onDismiss=dismissDetailsModal class="isolate-details-modal"}}
        <form class="standard-form edit-app-details-form">
          <h2>App details</h2>
          <div class="form-group">
            <label>
              Title
              <input name="title" type="text" maxlength="80" required
                     value="{{metadataDraft.title}}" disabled={{busy}}>
            </label>
          </div>
          <div class="metadata-details-row">
            <div class="form-group">
              <label>
                Noun phrase
                <input name="nounPhrase" type="text" maxlength="40" required
                       value="{{metadataDraft.nounPhrase}}" disabled={{busy}}>
              </label>
              <span class="form-subtext">For example: document, site, or app.</span>
            </div>
            <div class="form-group">
              <label>
                Compatibility date
                <input name="compatibilityDate" type="text" maxlength="10" required
                       pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" placeholder="YYYY-MM-DD"
                       value="{{metadataDraft.compatibilityDate}}"
                       disabled={{busy}}>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label>
              Short description
              <input name="shortDescription" type="text" maxlength="160" required
                     value="{{metadataDraft.shortDescription}}" disabled={{busy}}>
            </label>
          </div>
          <div class="modal-actions">
            <button type="button" class="cancel-app-details">Cancel</button>
            <button type="submit" class="save-app-details primary" disabled={{busy}}>Save</button>
          </div>
        </form>
      {{/modalDialogWithBackdrop}}
    {{/if}}

    {{#if publishModalOpen}}
      {{#modalDialogWithBackdrop onDismiss=dismissPublishModal class="isolate-publish-modal"}}
        <form class="standard-form publish-isolate-form">
          <h2>Publish {{draft.title}}</h2>
          <p>Publish the exact candidate shown by the digest below.</p>

          {{#if publishTargetApp}}
            <p class="publish-destination">
              <span>Publishing version {{publishTargetNextVersion}} of
                <strong>{{publishTargetApp.title}}</strong>.</span>
              <code>{{currentCandidate.normalizedDigest}}</code>
            </p>
          {{else}}
            <p class="publish-destination">
              <span>Publishing as a new app.</span>
              <code>{{currentCandidate.normalizedDigest}}</code>
            </p>
          {{/if}}

          {{#if selectedRevisionHistory}}
            <section class="revision-history" aria-labelledby="revision-history-heading">
              <h3 id="revision-history-heading">Revision history</h3>
              <ol>
                {{#each selectedRevisionHistory}}
                  <li>
                    <strong>Version {{revisionVersion}}</strong>
                    <code>{{normalizedDigest}}</code>
                    <time datetime="{{publishedAtIso}}">{{publishedAtLabel}}</time>
                  </li>
                {{/each}}
              </ol>
            </section>
          {{/if}}

          <div class="modal-actions">
            <button type="button" class="cancel-publish">Cancel</button>
            <button type="submit" class="confirm-publish primary" disabled={{publishDisabled}}>
              Publish
            </button>
          </div>
        </form>
      {{/modalDialogWithBackdrop}}
    {{/if}}
  </main>
</template>
