<template name="isolateAuthoringPage">
  {{setDocumentTitle}}
  {{#sandstormTopbarItem name="title" priority=5 topbar=globalTopbar}}Create app{{/sandstormTopbarItem}}

  <main class="isolate-authoring-page">
    <header>
      <a href="/apps" class="back-to-apps">← Apps</a>
      <h1>Create an isolate app</h1>
      <p>Edit a small Worker-style app, preview an immutable snapshot, and publish that exact
        snapshot when it is ready.</p>
    </header>

    <form class="standard-form isolate-authoring-form">
      <section class="metadata-fields" aria-labelledby="isolate-app-details-heading">
        <h2 id="isolate-app-details-heading">App details</h2>
        <div class="metadata-grid">
          <div class="form-group app-title-field">
            <label>
              Title
              <input name="title" type="text" maxlength="80" required value="{{draft.title}}"
                     disabled={{busy}}>
            </label>
          </div>
          <div class="form-group noun-phrase-field">
            <label>
              Noun phrase
              <input name="nounPhrase" type="text" maxlength="40" required
                     value="{{draft.nounPhrase}}" disabled={{busy}}>
            </label>
            <span class="form-subtext">For example: document, site, or app.</span>
          </div>
          <div class="form-group compatibility-date-field">
            <label>
              Compatibility date
              <input name="compatibilityDate" type="date" required
                     value="{{draft.compatibilityDate}}" disabled={{busy}}>
            </label>
          </div>
          <div class="form-group short-description-field">
            <label>
              Short description
              <input name="shortDescription" type="text" maxlength="160" required
                     value="{{draft.shortDescription}}" disabled={{busy}}>
            </label>
          </div>
        </div>
      </section>

      <section class="source-editor" aria-labelledby="isolate-worker-heading">
        <h2 id="isolate-worker-heading"><code>worker.js</code></h2>
        <p>The default export handles requests with a Worker-compatible <code>fetch()</code>
          method.</p>
        <label class="visually-hidden" for="isolate-worker-source">worker.js source</label>
        <textarea id="isolate-worker-source" name="source" required spellcheck="false"
                  disabled={{busy}} value="{{draft.source}}"></textarea>
      </section>

      <div class="authoring-actions">
        <button type="submit" disabled={{busy}}>Preview current draft</button>
        {{#if previewGrainId}}
          <a class="button" href="/grain/{{previewGrainId}}" target="_blank">Open preview</a>
          <a class="button" href="/grainlog/{{previewGrainId}}" target="_blank">View logs</a>
          <button type="button" class="reset-preview" disabled={{busy}}>Reset preview data</button>
        {{/if}}
      </div>
    </form>

    {{#if operationStatus}}
      <p class="operation-status {{operationStatus.kind}}" role="status">
        {{operationStatus.message}}
      </p>
    {{/if}}

    <section class="candidate-review" aria-labelledby="isolate-candidate-heading">
      <h2 id="isolate-candidate-heading">Candidate snapshot</h2>
      {{#if currentCandidate}}
        <dl>
          <div>
            <dt>Digest</dt>
            <dd><code>{{currentCandidate.normalizedDigest}}</code></dd>
          </div>
          <div>
            <dt>Compatibility date</dt>
            <dd>{{currentCandidate.compatibilityDate}}</dd>
          </div>
          <div>
            <dt>Bindings</dt>
            <dd>Sandstorm platform defaults</dd>
          </div>
        </dl>
        <p>This candidate is the exact immutable snapshot that the publish actions below will use.
          Editing the draft requires another preview.</p>
      {{else}}
        <p>Preview the current draft before publishing it.</p>
      {{/if}}
    </section>

    <section class="publish-controls" aria-labelledby="isolate-publish-heading">
      <h2 id="isolate-publish-heading">Publish</h2>
      <p>Publishing installs an app action. It does not create a grain.</p>
      <div class="publish-new-row">
        <button type="button" class="publish-new primary" disabled={{publishDisabled}}>
          Publish as new app
        </button>
      </div>

      {{#if hasCreatedApps}}
        <div class="publish-update-row">
          <label>
            Update an app you created
            <select class="existing-app" disabled={{busy}}>
              {{#each createdApps}}
                <option value="{{_id}}">{{title}} (version {{appVersion}})</option>
              {{/each}}
            </select>
          </label>
          <button type="button" class="publish-update" disabled={{publishDisabled}}>
            Publish update
          </button>
        </div>
      {{/if}}

      {{#if publishedResult}}
        <p class="published-result">
          Published <strong>{{publishedResult.title}}</strong> version
          {{publishedResult.appVersion}}.
          <a href="/apps/{{publishedResult.appId}}">View app</a>
        </p>
      {{/if}}
    </section>
  </main>
</template>
