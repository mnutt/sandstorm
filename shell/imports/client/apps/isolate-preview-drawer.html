<template name="isolatePreviewDrawer">
  <aside class="isolate-preview-drawer" aria-label="Isolate app preview">
    <header class="isolate-preview-toolbar">
      <div class="isolate-preview-title">
        <strong>Preview</strong>
        {{#if target.title}}<span>{{target.title}}</span>{{/if}}
        <code title="{{target.normalizedDigest}}">{{shortDigest}}</code>
      </div>
      <div class="isolate-preview-actions">
        <button type="button" class="reload-isolate-preview isolate-preview-icon-action"
                aria-label="Reload preview" title="Reload preview">
          <span class="icon icon-refresh" aria-hidden="true"></span>
        </button>
        <a class="isolate-preview-icon-action" href="/grain/{{target.grainId}}"
           target="_blank" rel="noopener" aria-label="Open preview in new tab"
           title="Open preview in new tab">
          <span class="icon icon-open-in-new" aria-hidden="true"></span>
        </a>
        <button type="button" class="close-isolate-preview isolate-preview-icon-action"
                aria-label="Close preview" title="Close preview">
          <span class="icon icon-close" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <div class="isolate-preview-frame-mount"></div>
    <div class="isolate-preview-log-mount"></div>
  </aside>
</template>
