<template name="grainPowerboxCard">
  {{ grainInfo.title }}
</template>

<template name="isolatePreviewerPowerboxCard">
  <div>Create and run private isolate previews{{#if option.accountTitle}}
    as {{option.accountTitle}}{{/if}}</div>
  <div>This lets the requesting app test arbitrary isolate code, but does not let it publish an
    app.</div>
</template>

<template name="isolatePublisherPowerboxCard">
  <div>{{option.publishIntent.action}} “{{option.publishIntent.title}}”</div>
  {{#if option.publishIntent.targetTitle}}
    <div>Current app: {{option.publishIntent.targetTitle}}</div>
  {{/if}}
  <div>Candidate: {{option.publishIntent.digest}}</div>
  <div>Compatibility date: {{option.publishIntent.compatibilityDate}}</div>
  <div>Compatibility flags:
    {{#if option.publishIntent.compatibilityFlags}}
      {{#each option.publishIntent.compatibilityFlags}}{{this}} {{/each}}
    {{else}}
      None
    {{/if}}
  </div>
  <div>Platform bindings:
    {{#if option.publishIntent.bindings}}
      {{#each option.publishIntent.bindings}}{{this}} {{/each}}
    {{else}}
      None
    {{/if}}
  </div>
  <div>Validation warnings:
    {{#if option.publishIntent.validationWarnings}}
      {{#each option.publishIntent.validationWarnings}}{{this}} {{/each}}
    {{else}}
      None
    {{/if}}
  </div>
  <div>This one-shot grant publishes only this reviewed candidate and target.</div>
</template>

<template name="uiViewPowerboxConfiguration">
  {{#if choseHostedObject}}
    <div class="powerbox-iframe-mount">{{ setupIframe }}</div>
  {{else}}
    <form>
      <p>{{_ "powerboxBuiltins.uiViewPowerboxConfiguration.explanation"}}</p>
      {{#each role in viewInfo.roles}}
        <label><input type="radio" name="role" value="{{role.index}}">{{role.title.defaultText}} - {{role.verbPhrase.defaultText}}</label>
      {{else}}
        <label><input type="radio" checked="true" name="role" value="all">{{_ "powerboxBuiltins.uiViewPowerboxConfiguration.fullAccess"}}</label>
      {{/each}}
      <div class="choose-buttons">
        <button class="connect-button">{{_ "powerboxBuiltins.uiViewPowerboxConfiguration.connectButton"}}</button>
        {{#if option.hostedObject}}
          <button class="choose-hosted-object">{{_ "powerboxBuiltins.uiViewPowerboxConfiguration.chooseHostedObjectButton"}}</button>
        {{/if}}
      </div>
    </form>
  {{/if}}
</template>

<template name="ipNetworkPowerboxCard">
  {{_ "powerboxBuiltins.ipNetworkPowerboxCard.explanation"}}
  {{#with encryption}}
    {{_ "powerboxBuiltins.ipNetworkPowerboxCard.encryptedWith" .}}
  {{/with}}
</template>

<template name="ipInterfacePowerboxCard">
  {{_ "powerboxBuiltins.ipInterfacePowerboxCard.explanation"}}
</template>

<template name="emailVerifierPowerboxCard">
  {{#if option.frontendRef.emailVerifier.services}}
    {{_ "powerboxBuiltins.emailVerifierPowerboxCard.verifyWith" serviceTitle}}
  {{else}}
    {{_ "powerboxBuiltins.emailVerifierPowerboxCard.verifyWithAnyService"}}

</template>

<template name="verifiedEmailPowerboxCard">
  {{ option.frontendRef.verifiedEmail.address }}
</template>

<template name="identityPowerboxCard">
  {{ option.profile.name }}
</template>

<template name="identityPowerboxConfiguration">
  <form>
    <p>{{_ "powerboxBuiltins.identityPowerboxConfiguration.explanation"}}</p>
    {{#each role in sufficientRoles}}
      <label><input type="radio" name="role" value="{{role.index}}">{{role.title.defaultText}} - {{role.verbPhrase.defaultText}}</label>
    {{else}}
      <label><input type="radio" checked="true" name="role" value="all">{{_ "powerboxBuiltins.identityPowerboxConfiguration.fullAccess"}}</label>
    {{/each}}
    <div class="choose-buttons">
      <button class="connect-button">{{_ "powerboxBuiltins.identityPowerboxConfiguration.connectButton"}}</button>
    </div>
  </form>
</template>

<template name="addNewVerifiedEmailPowerboxCard">
  {{_ "powerboxBuiltins.addNewVerifiedEmailPowerboxCard.explanation"}}
</template>

<template name="httpUrlPowerboxCard">
  {{_ "powerboxBuiltins.httpUrlPowerboxCard.useUrl" option.frontendRef.http.url}}
</template>

<template name="httpArbitraryPowerboxCard">
  {{_ "powerboxBuiltins.httpArbitraryPowerboxCard.explanation"}}
</template>

<template name="httpArbitraryPowerboxConfiguration">
  <form>
    <label>{{_ "powerboxBuiltins.httpCredentials.destination"}}
      <input class="url" type="url" required value="{{destination}}" readonly="{{option.httpUrl}}"
             placeholder="https://api.example.com/v1">
    </label>
    {{#with profile}}<p>{{title}}</p>{{/with}}
    {{#with urlDetails}}
      <p>{{_ "powerboxBuiltins.httpCredentials.scope"}} {{scheme}} {{host}}{{basePath}}</p>
      {{#if isPlainHttp}}<p class="warning-message">{{_ "powerboxBuiltins.httpCredentials.plainHttp"}}</p>{{/if}}
    {{/with}}
    <label>{{_ "powerboxBuiltins.httpCredentials.authentication"}}
      <select class="authentication">
        <option value="none" selected="{{authSelected 'none'}}">{{_ "powerboxBuiltins.httpCredentials.none"}}</option>
        <option value="bearer" selected="{{authSelected 'bearer'}}">Bearer</option>
        <option value="basic" selected="{{authSelected 'basic'}}">Basic</option>
      </select>
    </label>
    {{#if bearer}}
      <label>{{#if profile}}{{profile.secretLabel}}{{else}}{{_ "powerboxBuiltins.httpCredentials.token"}}{{/if}}
        <input class="secret bearer" type="password" required autocomplete="off">
      </label>
    {{/if}}
    {{#if basic}}
      <label>{{_ "powerboxBuiltins.httpCredentials.username"}}<input class="username secret" type="text" required autocomplete="off"></label>
      <label>{{_ "powerboxBuiltins.httpCredentials.password"}}<input class="secret password" type="password" autocomplete="new-password"></label>
    {{/if}}
    {{#if profile}}
      <label>{{_ "powerboxBuiltins.httpCredentials.organization"}}<input class="connection-header" name="openai-organization" type="text"></label>
      <label>{{_ "powerboxBuiltins.httpCredentials.project"}}<input class="connection-header" name="openai-project" type="text"></label>
    {{/if}}
    <p>{{_ "powerboxBuiltins.httpCredentials.authority"}}</p>
    <p>{{_ "powerboxBuiltins.httpCredentials.revocation"}}</p>
    {{#if error}}<p class="error-message">{{error}}</p>{{/if}}
    <div class="choose-buttons">
      <button type="submit" class="connect-button">{{_ "powerboxBuiltins.httpArbitraryPowerboxConfiguration.connectButton"}}</button>
    </div>
  </form>
</template>

<template name="httpOAuthPowerboxCard">
  {{_ "powerboxBuiltins.httpOAuthPowerboxCard.useService" option.oauthServiceInfo.service}}
</template>

<template name="httpOAuthPowerboxConfiguration">
  {{_ "powerboxBuiltins.httpOAuthPowerboxConfiguration.requestPermissionsFromService" option.oauthServiceInfo.service}}
</template>

<template name="outboundHttpUrlPowerboxCard">
  {{#with urlDetails}}
    <div>Outbound {{scheme}} API:</div>
    <div>{{compactMethods}} {{url}}</div>
    {{#if isPlainHttp}}
      <div class="warning-message">Warning: this endpoint uses unencrypted HTTP.</div>
    {{/if}}
  {{else}}
    <div>Outbound HTTP API: {{option.frontendRef.outboundHttp.baseUrl}}</div>
    <div>Allowed methods: {{methodsSummary}}</div>
  {{/with}}
</template>

<template name="outboundHttpCredentialsConfiguration">
  <form class="http-credentials-form">
    <div class="http-grant-summary">
      <h3>{{_ "powerboxBuiltins.httpCredentials.grantTitle"}}</h3>
      {{#with urlDetails}}
        <p>{{_ "powerboxBuiltins.httpCredentials.grantDestination"}} <strong>{{host}}</strong> {{_ "powerboxBuiltins.httpCredentials.pathPrefix"}}</p>
        {{#if isPlainHttp}}<p class="warning-message">{{_ "powerboxBuiltins.httpCredentials.plainHttp"}}</p>{{/if}}
      {{/with}}
      <div class="http-scope">
        <div class="http-scope-methods">{{#each scopeMethods}}<div>{{this}}</div>{{/each}}</div>
        <div class="http-scope-url">{{destination}}</div>
      </div>
      {{#if callerCredentials}}
        <p>{{_ "powerboxBuiltins.httpCredentials.callerAuthority"}}</p>
      {{else}}
        {{#if noCredentials}}
        <p>{{_ "powerboxBuiltins.httpCredentials.noCredentials"}}</p>
        {{else}}
        {{#if sigV4}}
          <p>{{_ "powerboxBuiltins.httpCredentials.s3Custody"}}</p>
        {{/if}}
        {{/if}}
      {{/if}}
    </div>
    <div class="http-form-fields">
      {{#if queryKey}}
        <p>{{_ "powerboxBuiltins.httpCredentials.queryPlacement"}} <code>{{queryParameter}}</code></p>
        <label>{{_ "powerboxBuiltins.httpCredentials.apiKey"}}
          <input class="secret query-key" type="password" required autocomplete="off" maxlength="4096">
        </label>
      {{/if}}
      {{#if sigV4}}
        <p>{{_ "powerboxBuiltins.httpCredentials.s3Signing"}} <strong>{{s3Region}}</strong></p>
        {{#if s3UnsignedPayload}}<p>{{_ "powerboxBuiltins.httpCredentials.s3UnsignedPayload"}}</p>{{/if}}
        <label>{{_ "powerboxBuiltins.httpCredentials.s3AccessKey"}}
          <input class="secret s3-access-key" type="text" required autocomplete="off" maxlength="128">
        </label>
        <label>{{_ "powerboxBuiltins.httpCredentials.s3SecretKey"}}
          <input class="secret s3-secret-key" type="password" required autocomplete="off" maxlength="4096">
        </label>
        <label>{{_ "powerboxBuiltins.httpCredentials.s3SessionToken"}}
          <input class="secret s3-session-token" type="password" autocomplete="off" maxlength="4096">
        </label>
      {{/if}}
      {{#if bearer}}
        <label>{{_ "powerboxBuiltins.httpCredentials.apiKey"}}
          <input class="secret bearer" type="password" required autocomplete="off" maxlength="4096">
        </label>
      {{/if}}
      {{#if apiKey}}
        <label>{{_ "powerboxBuiltins.httpCredentials.apiKey"}}
          <input class="secret api-key" type="password" required autocomplete="off" maxlength="4096">
        </label>
      {{/if}}
      {{#if authorizationToken}}
        <label>{{_ "powerboxBuiltins.httpCredentials.apiKey"}}
          <input class="secret authorization-token" type="password" required autocomplete="off" maxlength="4096">
        </label>
      {{/if}}
      {{#if basic}}
        <label>{{_ "powerboxBuiltins.httpCredentials.username"}}
          <input class="username secret" type="text" required autocomplete="off">
        </label>
        <label>{{_ "powerboxBuiltins.httpCredentials.password"}}
          <input class="secret password" type="password" autocomplete="new-password">
        </label>
      {{/if}}
      {{#if credentialPlacement}}
        <p class="http-credential-placement">{{_ "powerboxBuiltins.httpCredentials.valueSentAs"}} <code>{{credentialPlacement}}</code></p>
      {{/if}}
    </div>
    {{#unless noCredentials}}
      <p class="http-revocation-note">{{_ "powerboxBuiltins.httpCredentials.revocation"}}</p>
    {{/unless}}
    {{#if error}}<p class="error-message" role="alert">{{error}}</p>{{/if}}
    <div class="choose-buttons">
      <button type="submit" class="connect-button">{{_ "powerboxBuiltins.httpArbitraryPowerboxConfiguration.connectButton"}}</button>
    </div>
  </form>
</template>
